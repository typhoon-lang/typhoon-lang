name: Test

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.21.x"

      - name: Setup VS cmd
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Clang
        if: runner.os != 'macOS'
        uses: egor-tensin/setup-clang@v2
        with:
          version: latest
          platform: x64

      - name: Install Rust
        uses: moonrepo/setup-rust@v1

      - name: Check io_uring availability (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f /proc/sys/kernel/io_uring_disabled ]; then
            val=$(cat /proc/sys/kernel/io_uring_disabled)
            echo "io_uring_disabled = $val"
            case "$val" in
              0) echo "io_uring: enabled for unprivileged processes" ;;
              1) echo "io_uring: DISABLED for unprivileged processes (IORING_SETUP_SQPOLL/plain io_uring_setup will fail with EPERM for this job's user)" ;;
              2) echo "io_uring: FULLY DISABLED (io_uring_setup will fail for everyone, including root)" ;;
              *) echo "io_uring: unrecognized value $val" ;;
            esac
          else
            echo "io_uring_disabled sysctl not present — kernel predates this knob, io_uring unrestricted by it"
          fi
          uname -r

      - name: Run tests
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -E '/usr/bin$|/mingw64/bin$' | paste -sd ':')
          fi
          cargo build -p typhoon-cli
          cargo build -p typhoon-stdlib
          set -o pipefail
          cargo test -p typhoon-runtime -- --nocapture --test-threads=1 2>&1 | tee cargo-test-${{ matrix.os }}.log

      - name: Upload cargo test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-test-log-${{ matrix.os }}
          path: cargo-test-${{ matrix.os }}.log
          if-no-files-found: ignore

      # ---- Locate the pre-built binary (path differs by OS) ----

      - name: Set binary path (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "TY_BIN=./target/debug/tyc" >> $GITHUB_ENV

      - name: Set binary path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "TY_BIN=.\target\debug\tyc.exe" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---- Clear port 8080 if something is already using it ----

      - name: Free port 8080 (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pid=$(lsof -ti tcp:8080 2>/dev/null || true)
          if [ -n "$pid" ]; then
            echo "Killing stale process on :8080 (PID $pid)"
            kill -9 $pid || true
          fi

      - name: Free port 8080 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $conn = Get-NetTCPConnection -LocalPort 8080 -ErrorAction SilentlyContinue
          if ($conn) {
            $conn | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
            Write-Host "Killed stale process on :8080"
          }

      # ---- Start server using the pre-built binary directly ----
      # stdout -> server.log    (contains "Listening on :8080")
      # stderr -> server-err.log (contains [sched]/[coro] debug output)
      # Keeping them separate avoids the interleaved-buffer corruption seen
      # in server-linux.log where the leading "L" was swallowed mid-write.

      - name: Start server (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python script/run_ty_server.py >server.log 2>server-err.log &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          echo "Server started (PID $!)"

      - name: Start server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process `
            -FilePath "python" `
            -ArgumentList "script/run_ty_server.py" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput "server.log" `
            -RedirectStandardError "server-err.log"
          echo "SERVER_PID=$($proc.Id)" >> $env:GITHUB_ENV
          Write-Host "Server started (PID $($proc.Id))"

      # ---- Upload server log (always, for debugging) ----

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-${{ matrix.os }}
          path: |
            server.log
            server-err.log
          if-no-files-found: ignore

      # ---- Stop server (platform-specific) ----

      - name: Stop server (Linux / macOS)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi
          # Fallback: kill anything still holding :8080
          pid=$(lsof -ti tcp:8080 2>/dev/null || true)
          if [ -n "$pid" ]; then kill -9 $pid || true; fi

      - name: Stop server (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:SERVER_PID) {
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
          }
          # Fallback: kill anything still holding :8080
          $conn = Get-NetTCPConnection -LocalPort 8080 -ErrorAction SilentlyContinue
          if ($conn) {
            $conn | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
          }
